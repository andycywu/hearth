<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' https:; connect-src 'self' http://127.0.0.1:* http://localhost:* https:; object-src 'none'; base-uri 'none'; frame-src 'none'; frame-ancestors 'none'">
<title>TV AI Agent</title>
<!-- Pre-boot paint only; applyTvTheme() owns the look once the runtime starts,
     so all four hosts share one visual language. Transparent here rather than
     dark: the Activity window is translucent, and a solid page would defeat it
     for the first frame. -->
<style>
  html, body { margin: 0; height: 100%; background: transparent; color: #eef3fb; }
  #app { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 64px; box-sizing: border-box; }
  #status { font-size: 22px; opacity: .55; }
</style>
</head>
<body>
  <div id="app">
    <div id="status">TV AI Agent — starting…</div>
    <div id="hint"></div>
  </div>
  <!-- Bundled runtime: `pnpm bundle:aosp` writes main.js next to this file. -->
  <script type="module" src="main.js"></script>
</body></html>
