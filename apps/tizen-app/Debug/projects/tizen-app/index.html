<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
        <title>TV AI Agent</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="status">TV AI Agent — starting…</div>
      <div id="hint"></div>
    </div>
    <!--
      Samsung's `webapis.*` (audiocontrol, productinfo, tvinfo, network) is NOT an
      injected global the way `tizen.*` is — the app has to load it, and `$WEBAPIS`
      is an alias the web runtime resolves to the platform's copy. Without this
      line every webapis call is a TypeError, which is why device info read
      "unknown" and volume control could never have worked. Classic script, not a
      module, so it runs before the deferred module below.
    -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    <!--
      Launch flags (?demo, ?diag, ?llm=…), written by tools/package-tizen.mjs.
      Tizen drops the query string from config.xml's <content src>, so they can't
      travel in the URL. Absent in an unflagged build; a 404 here is harmless.
    -->
    <script src="launch-flags.js"></script>
    <!-- Bundled runtime: `pnpm build` output copied here by tools/bundle.mjs -->
    <script type="module" src="main.js"></script>
  </body>
</html>
