<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' https:; connect-src 'self' http://127.0.0.1:* http://localhost:* https:; object-src 'none'; base-uri 'none'; frame-src 'none'; frame-ancestors 'none'" />
    <title>TV AI Agent</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; color: #e8eefc; font-family: sans-serif; }
      #app { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 64px; box-sizing: border-box; }
      #status { font-size: 30px; opacity: .85; }
      #hint { font-size: 22px; opacity: .45; margin-top: 16px; line-height: 1.5; }
    </style>
    <!--
      The Luna bridge comes from LG's webOSTV.js, which is NOT bundled here (see
      README): drop the library in as webOSTVjs/webOSTV.js before packaging for a
      real TV. Loaded defensively so a missing file doesn't stop the runtime —
      the adapter surfaces it as a capability error instead of a blank screen.
    -->
    <script src="webOSTVjs/webOSTV.js" onerror="window.__WEBOSTV_MISSING__=true"></script>
  </head>
  <body>
    <div id="app">
      <div id="status">TV AI Agent — starting…</div>
      <div id="hint"></div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
