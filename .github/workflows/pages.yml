name: Demo (GitHub Pages)

# Publishes the dev harness so anyone can try the agent without installing
# anything: it is a static page and the offline scripted brain needs no backend,
# no API key and no TV.
#
# One-time setup in the repository: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:dev          # → apps/dev-harness/main.js
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp apps/dev-harness/index.html apps/dev-harness/main.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
